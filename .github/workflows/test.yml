name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # One key for all six legs: it hashes the lockfile, not the Node
          # version, because ~/.npm holds version-independent tarballs. On a
          # cold key five legs log "Failed to save: Unable to reserve cache"
          # while one saves it — expected and harmless; keying on the Node
          # version would store the same bytes three times to silence it.
          cache: 'npm'
      - run: npm ci
      - run: npm run test:all

  pack-smoke:
    name: Packed-tarball smoke check (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: ./scripts/pack-smoke.sh
