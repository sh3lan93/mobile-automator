name: Version Check

on:
  pull_request:
    branches:
      - main

jobs:
  detect-cli-changes:
    name: Detect CLI code changes
    runs-on: ubuntu-latest
    outputs:
      ships-code: ${{ steps.filter.outputs.cli }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event.pull_request.base.ref }}
          filters: |
            cli:
              - 'src/**'
              - 'bin/**'
              - 'package.json'

      - name: Report decision
        run: |
          if [[ "${{ steps.filter.outputs.cli }}" == "true" ]]; then
            echo "⚠️ CLI code changed - version bump required"
          else
            echo "✅ No CLI code changes - version check skipped"
          fi

  check-version:
    name: Verify version is bumped
    needs: detect-cli-changes
    runs-on: ubuntu-latest
    if: needs.detect-cli-changes.outputs.ships-code == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Required to fetch all tags

      - name: Read version from package.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION (tag: v$VERSION)"

      - name: Fetch release tags
        run: git fetch --tags

      # Fails when the version is already tagged or is not greater than the
      # highest release tag (#369): 0.40.13 once passed after v0.40.14 shipped.
      - name: Check version is ahead of every release tag
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: node scripts/version-gate.js "$VERSION" --mode pr
