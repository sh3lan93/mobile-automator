name: Showcase Replay

# Replays every shipped showcase scenario (showcase-app/, PRD #304, #313) with
# agent-free `mauto run` on an Android emulator and an iOS simulator, against
# the live TMDB API. Weekly and on demand; never on a pull request and never a
# required check, so a TMDB outage cannot block a merge.
#
# Written to be copied into your own app's repo:
#   - Per-app values live in the top-level `env:` block below, including
#     REPLAY_PROBE, the live-dependency check replay.sh runs after a failure.
#   - Steps marked `generic` work unchanged for any app, except the secret the
#     probe reads, which the two replay steps pass in their own `env:`.
#   - Steps marked `app-specific` (the builds and the TMDB job) are the
#     showcase's own: replace them with your app's build and your own
#     live-dependency check, or drop the check.
#   - Copy showcase-app/ci/replay.sh and ci/device-id.sh (both generic) next
#     to your scenarios.
#
# Secret: TMDB_API_KEY, a TMDB v3 key. Where it is unavailable (forks), every
# job after `key` is skipped and the run stays green.
#
# Each scenario's result is classified by its exit code (see ci/replay.sh):
# passed, scenario failed, external service outage, needs agent, or a mauto /
# device error. TMDB drift is caught before any device boots by the `tmdb` job.

on:
  schedule:
    - cron: '23 4 * * 1' # Mondays 04:23 UTC
  workflow_dispatch: {}
  # TEMPORARY(#313): a pre-merge run on this branch, since workflow_dispatch exists only on the default branch. Removed before the PR is ready.
  push:
    branches: [sample-app/313-ci-workflow]

permissions:
  contents: read

concurrency:
  group: showcase-replay
  cancel-in-progress: false

# Per-app values: the only block a copy has to edit besides the app-specific
# steps and the probe's secret in the two replay steps.
env:
  # The app's directory; every path below is relative to it.
  APP_DIR: showcase-app
  # The scenarios to replay, relative to APP_DIR. A glob, so a new scenario is
  # replayed without editing this file.
  SCENARIOS: 'scenarios/*.json'
  ANDROID_APK: androidApp/build/outputs/apk/debug/androidApp-debug.apk
  IOS_APP: build/ios/Build/Products/Debug-iphonesimulator/Reel Tracker.app
  # The mobile-automator release from npm: `latest`, or pin one like `0.41.0`.
  MAUTO_VERSION: latest
  # app-specific: ci/replay.sh runs REPLAY_PROBE after a failed scenario; a
  # non-zero exit reclassifies the failure as an outage of the app's live
  # dependency. This is the showcase's TMDB check: set your own probe, or
  # leave it empty to classify every failure as a failure.
  REPLAY_PROBE: bash ci/tmdb-check.sh --reachability
  # Keep the device engine and mauto from sending usage telemetry from CI.
  MOBILEMCP_DISABLE_TELEMETRY: '1'
  MAUTO_TELEMETRY: '0'

jobs:
  # generic: skip the run cleanly when the secret is not available (forks).
  key:
    name: Check for the TMDB_API_KEY secret
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.check.outputs.has_key }}
    steps:
      - name: Is the secret set? (generic)
        id: check
        env:
          KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            msg="Replay skipped: the replay secret is unavailable (secrets are never passed to forks)."
            echo "::notice title=Replay skipped::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

  # app-specific: the showcase's live-data contract with TMDB. A red job here
  # is TMDB (an outage or drifted data), not mauto; both device jobs skip.
  tmdb:
    name: TMDB live data (outage or drift, not mauto)
    needs: key
    if: needs.key.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Checkout (generic)
        uses: actions/checkout@v7

      - name: Check TMDB's live data (app-specific)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: bash ci/tmdb-check.sh

  android:
    name: Replay on Android emulator (API 36)
    needs: [key, tmdb]
    if: needs.key.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Checkout (generic)
        uses: actions/checkout@v7

      - name: Set up Java (app-specific)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # shared/build.gradle.kts reads the key from this env var.
      - name: Build the debug APK (app-specific)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./gradlew :androidApp:assembleDebug

      - name: Set up Node (generic)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install mauto from npm (generic)
        run: |
          npm i -g "mobile-automator@${MAUTO_VERSION}"
          mauto --version

      # generic. The showcase's .mobile-automator/ workspace is git-ignored, so
      # CI creates it. If you commit your workspace, drop this step.
      - name: Create the mauto workspace (generic)
        run: mauto setup --mode agnostic

      - name: Enable KVM (generic)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Replay every scenario on the emulator (generic)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # The secret REPLAY_PROBE reads, scoped to this step: swap in your
          # probe's secret, or drop it with the probe.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        with:
          api-level: 36
          arch: x86_64
          target: default
          # A phone-sized device. Without a profile the AVD is 320x640, where
          # the top bar's actions take the whole width and the "Popular films"
          # title every scenario waits for is not on screen. pixel_6 is in the
          # device list of the runner's cmdline-tools (12.0); pixel_9_pro, the
          # local AVD, is not.
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 300
          working-directory: ${{ env.APP_DIR }}
          # Each line runs as its own `sh -c`, so keep commands single-line
          # (the id and the replay share one line). ci/device-id.sh reads the
          # id from `mauto devices`: the engine may name the emulator by its
          # AVD, not `emulator-5554`.
          # $SCENARIOS is unquoted on purpose: the shell expands the glob.
          script: |
            adb install "$ANDROID_APK"
            ID="$(bash ci/device-id.sh android)" && bash ci/replay.sh "$ID" "$RUNNER_TEMP/replay-android" $SCENARIOS

      - name: Upload the replay report (generic)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: showcase-replay-android
          path: |
            ${{ runner.temp }}/replay-android
            ${{ env.APP_DIR }}/.mobile-automator/results
            ${{ env.APP_DIR }}/.mobile-automator/screenshots
          if-no-files-found: warn

  ios:
    name: Replay on iOS simulator
    needs: [key, tmdb]
    if: needs.key.outputs.has_key == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Checkout (generic)
        uses: actions/checkout@v7

      - name: Set up Java (app-specific)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # The Xcode build runs Gradle for the shared framework, which reads the
      # key from this env var.
      - name: Build the iOS app (app-specific)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: >-
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp
          -configuration Debug -sdk iphonesimulator -derivedDataPath build/ios
          CODE_SIGNING_ALLOWED=NO build

      - name: Set up Node (generic)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install mauto from npm (generic)
        run: |
          npm i -g "mobile-automator@${MAUTO_VERSION}"
          mauto --version

      # generic. The showcase's .mobile-automator/ workspace is git-ignored, so
      # CI creates it. If you commit your workspace, drop this step.
      - name: Create the mauto workspace (generic)
        run: mauto setup --mode agnostic

      # generic: the newest available iPhone on the newest iOS runtime.
      - name: Boot an iPhone simulator and install the app (generic)
        run: |
          UDID="$(xcrun simctl list -j devices available | jq -er '
            [ .devices | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-"))
              | (.key | capture("iOS-(?<v>[0-9-]+)$").v | split("-") | map(tonumber)) as $v
              | .value[] | select(.name | startswith("iPhone"))
              | { v: $v, udid } ]
            | sort_by(.v) | last | .udid')" || { echo "::error title=No iPhone simulator::no available iPhone simulator"; exit 1; }
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$IOS_APP"

      - name: Replay every scenario on the simulator (generic)
        env:
          # The secret REPLAY_PROBE reads, scoped to this step: swap in your
          # probe's secret, or drop it with the probe.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        # The id comes from `mauto devices` (ci/device-id.sh), as on Android,
        # so the replay targets the device mauto reports.
        # $SCENARIOS is unquoted on purpose: the shell expands the glob.
        run: |
          ID="$(bash ci/device-id.sh ios)"
          bash ci/replay.sh "$ID" "$RUNNER_TEMP/replay-ios" $SCENARIOS

      - name: Upload the replay report (generic)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: showcase-replay-ios
          path: |
            ${{ runner.temp }}/replay-ios
            ${{ env.APP_DIR }}/.mobile-automator/results
            ${{ env.APP_DIR }}/.mobile-automator/screenshots
          if-no-files-found: warn
